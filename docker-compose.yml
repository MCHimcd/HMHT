# docker compose up -d --build
services:
  influxdb:
    image: influxdb:3-core
    container_name: hmht-influxdb
    restart: unless-stopped
    command:
      - serve
      - --node-id
      - local
      - --object-store
      - file
      - --data-dir
      - /var/lib/influxdb3
    ports:
      - "8181:8181"
    volumes:
      - influxdb3_data:/var/lib/influxdb3

  agri-backend:
    build:
      context: ../../DevEcoStudioProjects/agri
      dockerfile: agri_system/Dockerfile
    container_name: agri-backend
    restart: unless-stopped
    working_dir: /app/agri_system/backend
    command: python backend_main_debug.py
    environment:
      TZ: Asia/Shanghai
      AGRI_DB_PATH: /data/agri_system.db
      MQTT_BROKER_HOST: broker.emqx.io
      MQTT_BROKER_PORT: "1883"
      AGENT_INTERVAL_MINUTES: "1"
      USE_MOCK_LLM: "true"
    volumes:
      - agri_db:/data

  agri-web:
    build:
      context: ../../DevEcoStudioProjects/agri
      dockerfile: agri_system/Dockerfile
    container_name: agri-web
    restart: unless-stopped
    working_dir: /app/agri_system/backend
    command: python web_server_debug.py
    environment:
      TZ: Asia/Shanghai
      AGRI_DB_PATH: /data/agri_system.db
    volumes:
      - agri_db:/data
    depends_on:
      - agri-backend
    ports:
      - "5000:5000"

  agri-mock-device:
    build:
      context: ../../DevEcoStudioProjects/agri
      dockerfile: agri_system/Dockerfile
    container_name: agri-mock-device
    restart: unless-stopped
    working_dir: /app/agri_system/backend
    command: python mock_device.py
    environment:
      TZ: Asia/Shanghai
      MQTT_BROKER_HOST: broker.emqx.io
      MQTT_BROKER_PORT: "1883"
      AGRI_DB_PATH: /data/agri_system.db
    volumes:
      - agri_db:/data
    depends_on:
      - agri-backend

  hmht:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hmht-app
    restart: unless-stopped
    depends_on:
      agri-web:
        condition: service_started
      influxdb:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      HMHT_RUN_MODE: bridge
      HMHT_MOCK_SEED_ENABLED: "true"
      HMHT_DB_URL: jdbc:mysql://host.docker.internal:3306/hmht?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      HMHT_DB_USER: root
      HMHT_DB_PASSWORD: 123456
      HMHT_AGRI_CHAT_URL: http://agri-web:5000
      HMHT_INFLUXDB_ENABLED: "true"
      HMHT_INFLUXDB_URL: http://influxdb:8181
      HMHT_INFLUXDB_DATABASE: wangnong
      HMHT_INFLUXDB_TOKEN: ""
    ports:
      - "8080:8080"

volumes:
  agri_db:
  influxdb3_data:
