spring.application.name=HMHT
# Run mode: mock (Java simulates data) or bridge (Java bridges to Python).
# In mock mode, demo data is seeded on startup and cleaned on shutdown.
hmht.run.mode=${HMHT_RUN_MODE:mock}

# ------------------------------
# HTTP server
# ------------------------------
server.port=8080
server.servlet.context-path=/api

# ------------------------------
# Logging
# ------------------------------
logging.level.root=INFO
logging.level.ww.wangnong=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.file.name=logs/hmht.log

# ------------------------------
# MySQL datasource
# ------------------------------
spring.datasource.url=${HMHT_DB_URL:jdbc:mysql://localhost:3306/hmht?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${HMHT_DB_USER:root}
spring.datasource.password=${HMHT_DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------
# JPA
# ------------------------------
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ------------------------------
# Flyway
# ------------------------------
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ------------------------------
# InfluxDB3 (set hmht.influxdb.enabled=true and provide a valid token to activate)
# ------------------------------
hmht.influxdb.enabled=${HMHT_INFLUXDB_ENABLED:true}
hmht.influxdb.url=${HMHT_INFLUXDB_URL:http://localhost:8181}
hmht.influxdb.database=${HMHT_INFLUXDB_DATABASE:wangnong}
hmht.influxdb.token=${HMHT_INFLUXDB_TOKEN:}

# ------------------------------
# MQTT
# ------------------------------
hmht.mqtt.enabled=true
hmht.mqtt.server-uri=${HMHT_MQTT_URI:tcp://47.109.27.231:1883}
hmht.mqtt.client-id=${HMHT_MQTT_CLIENT_ID:hmht-server}
hmht.mqtt.username=${HMHT_MQTT_USERNAME:}
hmht.mqtt.password=${HMHT_MQTT_PASSWORD:}
hmht.mqtt.clean-session=true
hmht.mqtt.connection-timeout-seconds=10
hmht.mqtt.keep-alive-interval-seconds=30
hmht.mqtt.default-topic=hmht/default

# ------------------------------
# Python agri chat proxy (bridge mode only)
# ------------------------------
hmht.agri.chat.base-url=${HMHT_AGRI_CHAT_URL:http://localhost:5000}
hmht.mqtt.qos=1

# ------------------------------
# Command ACK retry loop (bridge mode)
# ------------------------------
hmht.command.retry.check-interval-ms=${HMHT_COMMAND_RETRY_CHECK_INTERVAL_MS:5000}
hmht.command.retry.initial-delay-ms=${HMHT_COMMAND_RETRY_INITIAL_DELAY_MS:3000}
hmht.command.retry.max-retries=${HMHT_COMMAND_RETRY_MAX_RETRIES:3}
hmht.command.retry.default-timeout-ms=${HMHT_COMMAND_RETRY_DEFAULT_TIMEOUT_MS:5000}
hmht.command.retry.batch-size=${HMHT_COMMAND_RETRY_BATCH_SIZE:200}
