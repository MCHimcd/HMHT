spring.application.name=HMHT
hmht.course.edition=true

# ------------------------------
# HTTP server
# ------------------------------
server.port=8080
server.servlet.context-path=/api

# ------------------------------
# Logging (profile-specific levels in logback-spring.xml)
# ------------------------------
logging.level.root=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.org.eclipse.paho.client=WARN
logging.file.name=logs/hmht.log

# ------------------------------
# MySQL datasource
# ------------------------------
spring.datasource.url=${HMHT_DB_URL:jdbc:mysql://localhost:3306/hmht?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${HMHT_DB_USER:root}
spring.datasource.password=${HMHT_DB_PASSWORD:MS_120324060219}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------
# HikariCP connection pool
# ------------------------------
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=15000

# ------------------------------
# JPA
# ------------------------------
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ------------------------------
# Flyway
# ------------------------------
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
